<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa nhân viên</title>
</head>
<body>
    <h1>Sửa nhân viên {{ employee.id }}</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="post" action="/employees/{{ employee.id }}/edit">
        <p>
            <label for="name">Họ tên:</label>
            <input
                id="name"
                name="name"
                value="{{ form_data.get('name', '') }}"
                maxlength="100"
                required
            >
        </p>

        <p>
            <label for="department_id">Phòng ban:</label>
            <select id="department_id" name="department_id" required>
                <option value="">Chọn phòng ban</option>

                {% for department in departments %}
                <option
                    value="{{ department.id }}"
                    {% if department.id == form_data.get('department_id') %}
                    selected
                    {% endif %}
                >
                    {{ department.name }}
                </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label for="position">Chức vụ:</label>
            <input
                id="position"
                name="position"
                value="{{ form_data.get('position', '') }}"
                maxlength="100"
            >
        </p>

        <p>
            <label for="phone">Điện thoại:</label>
            <input
                id="phone"
                name="phone"
                type="tel"
                value="{{ form_data.get('phone', '') }}"
                maxlength="20"
            >
        </p>

        <p>
            <label for="email">Email:</label>
            <input
                id="email"
                name="email"
                type="email"
                value="{{ form_data.get('email', '') }}"
                maxlength="255"
            >
        </p>

        <p>
            <label for="gender">Giới tính:</label>
            <select id="gender" name="gender">
                <option value="">Chưa cập nhật</option>

                {% for gender_name in ["Nam", "Nữ", "Khác"] %}
                <option
                    value="{{ gender_name }}"
                    {% if form_data.get('gender') == gender_name %}
                    selected
                    {% endif %}
                >
                    {{ gender_name }}
                </option>
                {% endfor %}
            </select>
        </p>

        <p>
            <label for="address">Địa chỉ:</label>
            <input
                id="address"
                name="address"
                value="{{ form_data.get('address', '') }}"
                maxlength="255"
            >
        </p>

        <p>
            <label for="birthday">Ngày sinh:</label>
            <input
                id="birthday"
                name="birthday"
                type="date"
                value="{{ form_data.get('birthday', '') }}"
            >
        </p>

        <p>
            <label for="start_date">Ngày vào làm:</label>
            <input
                id="start_date"
                name="start_date"
                type="date"
                value="{{ form_data.get('start_date', '') }}"
            >
        </p>

        <button type="submit">Lưu</button>
    </form>

    <a href="/employees/{{ employee.id }}">Quay lại hồ sơ</a>
</body>
</html>
