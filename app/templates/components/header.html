<header class="topbar">
  <div class="topbar-context">
    {% if not is_login %}
      <button type="button" class="icon-button sidebar-open" aria-label="Mở điều hướng" aria-controls="sidebar" aria-expanded="false" hidden>{{ icon('menu') }}</button>
      <span class="context-dot" aria-hidden="true">
      </span>
      <span>
        {% if is_admin %}Không gian quản trị{% else %}Không gian cá nhân{% endif %}
      </span>
    {% else %}
      <a class="login-brand" href="/">Hệ thống Quản lý Nhân sự</a>
    {% endif %}
  </div>
  <div class="topbar-actions">
    <button type="button" class="theme-toggle" aria-pressed="false" hidden>{{ icon('theme') }}<span class="theme-label">Chế độ tối</span>
    </button>
    {% if not is_login %}
      {# Not every page receives `user`, so the label stays the same everywhere. #}
      <a class="account-link" href="/profile">{{ icon('person') }}<span>Hồ sơ cá nhân</span>
      </a>
    {% endif %}
  </div>
</header>
